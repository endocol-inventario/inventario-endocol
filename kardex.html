<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Kardex</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card sombra mt-4">

<div class="card-body">

<h3 class="text-center mb-4">
ENDOCOL
</h3>

<h5 class="text-center">
Kardex del producto
</h5>

<div class="mb-3">

<label>Código</label>

<input
class="form-control"
id="txtCodigoKardex"
readonly>

</div>

<div class="table-responsive">

<table class="table table-bordered table-striped">

<thead>

<tr>

<th>Fecha</th>
<th>Movimiento</th>
<th>Cantidad</th>
<th>Stock anterior</th>
<th>Stock nuevo</th>

</tr>

</thead>

<tbody id="tablaKardex">

</tbody>

</table>

</div>

<button
class="btn btn-secondary w-100 mt-3"
onclick="history.back()">

Volver

</button>

</div>

</div>

</div>

</div>

</div>

<script src="js/kardex.js"></script>

</html>
