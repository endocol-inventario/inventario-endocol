<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva materia prima - Endocol</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="container py-4"><div class="row justify-content-center"><div class="col-md-7 col-lg-6"><div class="card sombra"><div class="card-body"><h3 class="text-center mb-4">➕ Nueva materia prima</h3><div id="mensaje"></div><div class="mb-3"><label class="form-label">Código</label><div class="input-group"><input id="txtCodigo" class="form-control" placeholder="Ej. MP005"><button id="btnSiguiente" class="btn btn-outline-secondary">Sugerir</button></div></div><div class="mb-3"><label class="form-label">Descripción *</label><input id="txtDescripcion" class="form-control"></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Unidad *</label><select id="txtUnidad" class="form-select"><option>UND</option><option>m</option><option>kg</option><option>g</option><option>L</option><option>ml</option><option>ROLLO</option><option>PAQ</option><option>CAJA</option></select></div><div class="col-md-6 mb-3"><label class="form-label">Ubicación</label><input id="txtUbicacion" class="form-control"></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Stock inicial</label><input id="txtStockInicial" type="number" min="0" step="any" value="0" class="form-control"></div><div class="col-md-6 mb-3"><label class="form-label">Responsable</label><input id="txtResponsable" class="form-control"></div></div><div class="mb-3"><label class="form-label">Proveedor</label><input id="txtProveedor" class="form-control"></div><div class="mb-3"><label class="form-label">Observaciones</label><textarea id="txtObservaciones" class="form-control" rows="3"></textarea></div><button id="btnGuardar" class="btn btn-success btn-lg w-100">💾 Guardar materia prima</button><button id="btnVolver" class="btn btn-outline-secondary w-100 mt-2">← Volver</button><div id="resultadoQR" class="text-center mt-4" style="display:none"><hr><h5>Materia prima creada</h5><div id="datosCreada"></div><img id="imgQR" alt="QR" style="max-width:280px;width:100%"><a id="btnAbrirProducto" class="btn btn-primary w-100 mt-3">Abrir producto</a><a id="btnDescargarQR" class="btn btn-outline-dark w-100 mt-2" target="_blank">🖨️ Abrir QR para imprimir</a></div></div></div></div></div><script src="js/nueva-materia.js"></script></body></html>
