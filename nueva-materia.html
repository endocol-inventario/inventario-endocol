<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Nueva Materia Prima - ENDOCOL</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>

    body {
      background-color: #f4f6f9;
    }

    .container {
      max-width: 850px;
    }

    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card-header {
      background-color: #0d6efd;
      color: white;
      border-radius: 15px 15px 0 0 !important;
      padding: 20px;
    }

    .form-label {
      font-weight: 600;
    }

    .btn {
      border-radius: 8px;
    }

    #resultadoQR {
      display: none;
    }

    #imgQR {
      max-width: 250px;
      margin: 15px auto;
      display: block;
    }

    .stock-box {
      background-color: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      border: 1px solid #dee2e6;
    }

    .stock-title {
      font-weight: 700;
      margin-bottom: 15px;
    }

  </style>

</head>


<body>


<div class="container py-4">


  <!-- ===================================== -->
  <!-- ENCABEZADO -->
  <!-- ===================================== -->

  <div class="card">

    <div class="card-header">

      <h3 class="mb-1">
        Nueva Materia Prima
      </h3>

      <small>
        Sistema de Inventario ENDOCOL
      </small>

    </div>


    <div class="card-body p-4">


      <!-- ================================= -->
      <!-- MENSAJES -->
      <!-- ================================= -->

      <div id="mensaje"></div>


      <!-- ================================= -->
      <!-- CÓDIGO -->
      <!-- ================================= -->

      <div class="mb-3">

        <label
          for="txtCodigo"
          class="form-label">

          Código

        </label>


        <div class="input-group">

          <input
            type="text"
            class="form-control"
            id="txtCodigo"
            placeholder="Ejemplo: MP001">

          <button
            type="button"
            class="btn btn-outline-primary"
            id="btnSiguiente">

            Sugerir código

          </button>

        </div>

      </div>


      <!-- ================================= -->
      <!-- DESCRIPCIÓN -->
      <!-- ================================= -->

      <div class="mb-3">

        <label
          for="txtDescripcion"
          class="form-label">

          Descripción

        </label>


        <input
          type="text"
          class="form-control"
          id="txtDescripcion"
          placeholder="Nombre de la materia prima">

      </div>


      <!-- ================================= -->
      <!-- UNIDAD -->
      <!-- ================================= -->

      <div class="mb-3">

        <label
          for="txtUnidad"
          class="form-label">

          Unidad de medida

        </label>


        <select
          class="form-select"
          id="txtUnidad">

          <option value="">
            Seleccione una unidad
          </option>

          <option value="UNIDAD">
            Unidad
          </option>

          <option value="METRO">
            Metro
          </option>

          <option value="CENTIMETRO">
            Centímetro
          </option>

          <option value="KILOGRAMO">
            Kilogramo
          </option>

          <option value="GRAMO">
            Gramo
          </option>

          <option value="LITRO">
            Litro
          </option>

          <option value="MILILITRO">
            Mililitro
          </option>

          <option value="ROLLO">
            Rollo
          </option>

          <option value="CAJA">
            Caja
          </option>

          <option value="PAQUETE">
            Paquete
          </option>

          <option value="OTRO">
            Otro
          </option>

        </select>

      </div>


      <!-- ================================= -->
      <!-- UBICACIÓN -->
      <!-- ================================= -->

      <div class="mb-4">

        <label
          for="txtUbicacion"
          class="form-label">

          Ubicación

        </label>


        <input
          type="text"
          class="form-control"
          id="txtUbicacion"
          placeholder="Ejemplo: Estante A1">

      </div>


      <!-- ================================= -->
      <!-- CONTROL DE STOCK -->
      <!-- ================================= -->

      <div class="stock-box mb-4">

        <div class="stock-title">

          Control de inventario

        </div>


        <div class="row g-3">


          <!-- STOCK INICIAL -->

          <div class="col-md-4">

            <label
              for="txtStockInicial"
              class="form-label">

              Stock inicial

            </label>


            <input
              type="number"
              class="form-control"
              id="txtStockInicial"
              min="0"
              step="any"
              value="0">

            <div class="form-text">

              Cantidad disponible al crear la materia prima.

            </div>

          </div>


          <!-- STOCK MÍNIMO -->

          <div class="col-md-4">

            <label
              for="txtStockMinimo"
              class="form-label">

              Stock mínimo

            </label>


            <input
              type="number"
              class="form-control"
              id="txtStockMinimo"
              min="0"
              step="any"
              value="0">

            <div class="form-text">

              Nivel en el que debe aparecer "POR AGOTARSE".

            </div>

          </div>


          <!-- STOCK MÁXIMO -->

          <div class="col-md-4">

            <label
              for="txtStockMaximo"
              class="form-label">

              Stock máximo

            </label>


            <input
              type="number"
              class="form-control"
              id="txtStockMaximo"
              min="0"
              step="any"
              value="0">

            <div class="form-text">

              Nivel máximo recomendado de inventario.

            </div>

          </div>


        </div>

      </div>


      <!-- ================================= -->
      <!-- RESPONSABLE -->
      <!-- ================================= -->

      <div class="mb-3">

        <label
          for="txtResponsable"
          class="form-label">

          Responsable

        </label>


        <input
          type="text"
          class="form-control"
          id="txtResponsable"
          placeholder="Persona responsable">

      </div>


      <!-- ================================= -->
      <!-- PROVEEDOR -->
      <!-- ================================= -->

      <div class="mb-3">

        <label
          for="txtProveedor"
          class="form-label">

          Proveedor

        </label>


        <input
          type="text"
          class="form-control"
          id="txtProveedor"
          placeholder="Proveedor de la materia prima">

      </div>


      <!-- ================================= -->
      <!-- OBSERVACIONES -->
      <!-- ================================= -->

      <div class="mb-4">

        <label
          for="txtObservaciones"
          class="form-label">

          Observaciones

        </label>


        <textarea
          class="form-control"
          id="txtObservaciones"
          rows="3"
          placeholder="Observaciones adicionales"></textarea>

      </div>


      <!-- ================================= -->
      <!-- BOTONES -->
      <!-- ================================= -->

      <div class="d-flex gap-2">

        <button
          type="button"
          class="btn btn-secondary"
          id="btnVolver">

          ← Volver

        </button>


        <button
          type="button"
          class="btn btn-success"
          id="btnGuardar">

          Guardar materia prima

        </button>

      </div>


      <!-- ================================= -->
      <!-- RESULTADO QR -->
      <!-- ================================= -->

      <div
        id="resultadoQR"
        class="mt-4">

        <hr>


        <h5 class="text-center">

          Materia prima creada correctamente

        </h5>


        <p
          id="datosCreada"
          class="text-center">
        </p>


        <img
          id="imgQR"
          src=""
          alt="Código QR">


        <div class="d-flex justify-content-center gap-2 flex-wrap">

          <a
            id="btnAbrirProducto"
            href="#"
            target="_blank"
            class="btn btn-primary">

            Abrir producto

          </a>


          <a
            id="btnDescargarQR"
            href="#"
            target="_blank"
            class="btn btn-outline-success">

            Abrir QR

          </a>

        </div>

      </div>


    </div>

  </div>


</div>


<!-- ===================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================== -->

<script src="nueva-materia.js"></script>


</body>

</html>
