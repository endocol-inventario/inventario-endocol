<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Inventario ENDOCOL</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Estilos ENDOCOL -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        /* ======================================
           DASHBOARD
        ====================================== */

        .dashboard-card {

            border: none;

            border-radius: 15px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

            transition:
                transform 0.15s ease;

        }


        .dashboard-card:hover {

            transform:
                translateY(-2px);

        }


        .dashboard-number {

            font-size: 1.8rem;

            font-weight: bold;

        }


        .dashboard-label {

            font-size: 0.9rem;

            color: #6c757d;

        }


        /* ======================================
           ESTADOS
        ====================================== */

        .estado-normal {

            color: #198754;

            font-weight: bold;

        }


        .estado-agotarse {

            color: #d39e00;

            font-weight: bold;

        }


        .estado-agotado {

            color: #dc3545;

            font-weight: bold;

        }


        .estado-sobrestock {

            color: #0d6efd;

            font-weight: bold;

        }


        /* ======================================
           TABLA
        ====================================== */

        .tabla-dashboard {

            font-size: 0.9rem;

        }


        .tabla-dashboard th {

            white-space: nowrap;

        }


        /* ======================================
           BOTÓN QR
        ====================================== */

        .btn-qr {

            min-height: 52px;

            font-size: 1.05rem;

        }


        /* ======================================
           CARGANDO
        ====================================== */

        .dashboard-loading {

            text-align: center;

            padding: 20px;

            color: #6c757d;

        }

    </style>

</head>


<body>


<div class="container py-3">


    <!-- ======================================
         ENCABEZADO
    ====================================== -->

    <div class="text-center mb-4">

        <h2 class="fw-bold">
            ENDOCOL
        </h2>

        <p class="text-muted mb-0">
            Sistema de Inventario
        </p>

    </div>


    <!-- ======================================
         ACCESO AL ESCÁNER
    ====================================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h5 class="mb-3">
                Consulta de materia prima
            </h5>


            <div class="input-group">

                <input
                    type="text"
                    id="txtBuscarCodigo"
                    class="form-control"
                    placeholder="Ingrese código MP001"
                    autocomplete="off"
                >


                <button
                    id="btnBuscar"
                    class="btn btn-primary"
                    type="button"
                >

                    Buscar

                </button>

            </div>


            <button
                id="btnEscanear"
                class="btn btn-success w-100 btn-qr mt-3"
                type="button"
            >

                📷 Escanear código QR

            </button>

        </div>

    </div>


    <!-- ======================================
         DASHBOARD
    ====================================== -->

    <h4 class="fw-bold mb-3">
        📊 Estado del inventario
    </h4>


    <div
        id="dashboardMensaje"
        class="dashboard-loading"
    >

        Consultando inventario...

    </div>


    <div
        id="dashboardContenido"
        style="display:none;"
    >


        <!-- ==================================
             INDICADORES
        ================================== -->

        <div class="row g-3 mb-4">


            <!-- TOTAL -->

            <div class="col-6 col-md-3">

                <div
                    class="card dashboard-card h-100"
                >

                    <div class="card-body">

                        <div
                            class="dashboard-number"
                            id="totalMaterias"
                        >
                            0
                        </div>

                        <div class="dashboard-label">
                            Total materias primas
                        </div>

                    </div>

                </div>

            </div>


            <!-- NORMAL -->

            <div class="col-6 col-md-3">

                <div
                    class="card dashboard-card h-100"
                >

                    <div class="card-body">

                        <div
                            class="dashboard-number text-success"
                            id="totalNormal"
                        >
                            0
                        </div>

                        <div class="dashboard-label">
                            🟢 Normal
                        </div>

                    </div>

                </div>

            </div>


            <!-- POR AGOTARSE -->

            <div class="col-6 col-md-3">

                <div
                    class="card dashboard-card h-100"
                >

                    <div class="card-body">

                        <div
                            class="dashboard-number text-warning"
                            id="totalPorAgotarse"
                        >
                            0
                        </div>

                        <div class="dashboard-label">
                            🟡 Por agotarse
                        </div>

                    </div>

                </div>

            </div>


            <!-- AGOTADO -->

            <div class="col-6 col-md-3">

                <div
                    class="card dashboard-card h-100"
                >

                    <div class="card-body">

                        <div
                            class="dashboard-number text-danger"
                            id="totalAgotado"
                        >
                            0
                        </div>

                        <div class="dashboard-label">
                            🔴 Agotado
                        </div>

                    </div>

                </div>

            </div>


        </div>


        <!-- ==================================
             SEGUNDA FILA
        ================================== -->

        <div class="row g-3 mb-4">


            <!-- SOBRESTOCK -->

            <div class="col-6 col-md-3">

                <div
                    class="card dashboard-card h-100"
                >

                    <div class="card-body">

                        <div
                            class="dashboard-number text-primary"
                            id="totalSobrestock"
                        >
                            0
                        </div>

                        <div class="dashboard-label">
                            🔵 Sobrestock
                        </div>

                    </div>

                </div>

            </div>


        </div>


        <!-- ==================================
             MATERIAS PRIMAS A REVISAR
        ================================== -->

        <div class="card dashboard-card mb-4">

            <div class="card-body">


                <h5 class="fw-bold mb-3">

                    ⚠️ Materias primas que requieren atención

                </h5>


                <div class="table-responsive">

                    <table
                        class="table table-sm table-hover align-middle tabla-dashboard"
                    >

                        <thead>

                            <tr>

                                <th>
                                    Código
                                </th>

                                <th>
                                    Materia prima
                                </th>

                                <th>
                                    Stock
                                </th>

                                <th>
                                    Mínimo
                                </th>

                                <th>
                                    Estado
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="tablaAlertas"
                        >

                        </tbody>

                    </table>

                </div>


            </div>

        </div>


    </div>


</div>


<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script src="js/app.js"></script>


</body>

</html>
