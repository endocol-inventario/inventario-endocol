<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Inventario ENDOCOL</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Estilos propios -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        /* ==========================================
           DASHBOARD
        ========================================== */

        .dashboard-card {

            border: none;

            border-radius: 15px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);

            height: 100%;

        }


        .dashboard-number {

            font-size: 1.8rem;

            font-weight: bold;

        }


        .dashboard-label {

            font-size: 0.9rem;

            color: #6c757d;

        }


        /* ==========================================
           ESTADOS
        ========================================== */

        .estado-normal {

            color: #198754;

            font-weight: bold;

        }


        .estado-agotarse {

            color: #d39e00;

            font-weight: bold;

        }


        .estado-agotado {

            color: #dc3545;

            font-weight: bold;

        }


        .estado-sobrestock {

            color: #0d6efd;

            font-weight: bold;

        }


        /* ==========================================
           TABLA
        ========================================== */

        .tabla-dashboard {

            font-size: 0.9rem;

        }


        .tabla-dashboard th {

            white-space: nowrap;

        }


        /* ==========================================
           BOTONES PRINCIPALES
        ========================================== */

        .boton-principal {

            min-height: 52px;

            font-size: 1.05rem;

        }


        /* ==========================================
           DASHBOARD CARGANDO
        ========================================== */

        .dashboard-loading {

            text-align: center;

            padding: 20px;

            color: #6c757d;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==========================================
         CABECERA
    ========================================== -->

    <div class="row justify-content-center">

        <div class="col-md-7">


            <div class="card sombra mt-4 mb-4">


                <div class="card-body text-center">


                    <!-- LOGO -->

                    <img
                        src="img/logo.png"
                        class="logo"
                        onerror="this.style.display='none'"
                        alt="ENDOCOL"
                    >


                    <h2 class="mt-3">
                        ENDOCOL
                    </h2>


                    <p class="text-secondary">
                        Sistema de Inventario
                    </p>


                    <!-- ==================================
                         ESCANEAR QR
                    ================================== -->

                    <button
                        class="btn btn-primary btn-lg w-100 mt-4 boton-principal"
                        id="btnEscanear"
                        type="button"
                    >

                        📷 Escanear QR

                    </button>


                    <div class="my-3">

                        <strong>
                            o
                        </strong>

                    </div>


                    <!-- ==================================
                         BUSCAR CÓDIGO
                    ================================== -->

                    <input
                        type="text"
                        id="txtCodigo"
                        class="form-control form-control-lg"
                        placeholder="Código del material"
                        autocomplete="off"
                    >


                    <button
                        class="btn btn-success btn-lg w-100 mt-3 boton-principal"
                        id="btnBuscar"
                        type="button"
                    >

                        🔎 Buscar producto

                    </button>


                    <!-- ==================================
                         NUEVA MATERIA PRIMA
                    ================================== -->

                    <button
                        class="btn btn-outline-primary btn-lg w-100 mt-3 boton-principal"
                        id="btnNuevaMateria"
                        type="button"
                    >

                        ➕ Nueva materia prima

                    </button>


                </div>

            </div>


        </div>

    </div>



    <!-- ==========================================
         DASHBOARD
    ========================================== -->

    <div class="row justify-content-center">

        <div class="col-md-10">


            <h4 class="fw-bold mb-3">

                📊 Estado del inventario

            </h4>


            <!-- MENSAJE CARGANDO -->

            <div
                id="dashboardMensaje"
                class="dashboard-loading"
            >

                Consultando inventario...

            </div>


            <!-- CONTENIDO DASHBOARD -->

            <div
                id="dashboardContenido"
                style="display:none;"
            >


                <!-- ==================================
                     INDICADORES
                ================================== -->

                <div class="row g-3 mb-4">


                    <!-- TOTAL -->

                    <div class="col-6 col-md-3">

                        <div class="card dashboard-card">

                            <div class="card-body">

                                <div
                                    class="dashboard-number"
                                    id="totalMaterias"
                                >
                                    0
                                </div>

                                <div class="dashboard-label">

                                    Total materias primas

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- NORMAL -->

                    <div class="col-6 col-md-3">

                        <div class="card dashboard-card">

                            <div class="card-body">

                                <div
                                    class="dashboard-number text-success"
                                    id="totalNormal"
                                >
                                    0
                                </div>

                                <div class="dashboard-label">

                                    🟢 Normal

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- POR AGOTARSE -->

                    <div class="col-6 col-md-3">

                        <div class="card dashboard-card">

                            <div class="card-body">

                                <div
                                    class="dashboard-number text-warning"
                                    id="totalPorAgotarse"
                                >
                                    0
                                </div>

                                <div class="dashboard-label">

                                    🟡 Por agotarse

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- AGOTADO -->

                    <div class="col-6 col-md-3">

                        <div class="card dashboard-card">

                            <div class="card-body">

                                <div
                                    class="dashboard-number text-danger"
                                    id="totalAgotado"
                                >
                                    0
                                </div>

                                <div class="dashboard-label">

                                    🔴 Agotado

                                </div>

                            </div>

                        </div>

                    </div>


                </div>



                <!-- ==================================
                     SEGUNDA FILA
                ================================== -->

                <div class="row g-3 mb-4">


                    <!-- SOBRESTOCK -->

                    <div class="col-6 col-md-3">

                        <div class="card dashboard-card">

                            <div class="card-body">

                                <div
                                    class="dashboard-number text-primary"
                                    id="totalSobrestock"
                                >
                                    0
                                </div>

                                <div class="dashboard-label">

                                    🔵 Sobrestock

                                </div>

                            </div>

                        </div>

                    </div>


                </div>



                <!-- ==================================
                     ALERTAS
                ================================== -->

                <div class="card dashboard-card mb-5">

                    <div class="card-body">


                        <h5 class="fw-bold mb-3">

                            ⚠️ Materias primas que requieren atención

                        </h5>


                        <div class="table-responsive">

                            <table
                                class="table table-sm table-hover align-middle tabla-dashboard"
                            >

                                <thead>

                                    <tr>

                                        <th>
                                            Código
                                        </th>

                                        <th>
                                            Materia prima
                                        </th>

                                        <th>
                                            Stock
                                        </th>

                                        <th>
                                            Mínimo
                                        </th>

                                        <th>
                                            Estado
                                        </th>

                                    </tr>

                                </thead>


                                <tbody
                                    id="tablaAlertas"
                                >

                                </tbody>

                            </table>

                        </div>


                    </div>

                </div>


            </div>


        </div>

    </div>


</div>



<!-- ==========================================
     JAVASCRIPT PRINCIPAL
========================================== -->

<script src="js/app.js"></script>


</body>

</html>
