<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Inventario ENDOCOL</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

    <style>

        body {
            background: #f4f6f9;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
        }

        .tarjeta-menu {
            background: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .titulo {
            font-weight: bold;
        }

        .subtitulo {
            color: #6c757d;
        }

        .boton-menu {
            min-height: 90px;
            font-size: 18px;
            font-weight: 600;
        }

        .logo {
            max-width: 180px;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        #mensaje {
            min-height: 10px;
        }

    </style>

</head>


<body>


<div class="container-fluid py-5">

    <div class="contenedor">


        <!-- =====================================
             MENÚ PRINCIPAL
        ====================================== -->

        <div class="tarjeta-menu">


            <!-- LOGO -->

            <div class="text-center">

                <img
                    src="img/logo.png"
                    class="logo"
                    alt="ENDOCOL"
                    onerror="this.style.display='none';">

                <h1 class="titulo">
                    Sistema de Inventario
                </h1>

                <p class="subtitulo">
                    ENDOCOL
                </p>

            </div>


            <hr class="my-4">


            <!-- =====================================
                 MENSAJES
            ====================================== -->

            <div
                id="mensaje"
                class="mb-3">
            </div>


            <!-- =====================================
                 BOTONES PRINCIPALES
            ====================================== -->

            <div class="row g-3">


                <!-- BUSCAR PRODUCTO -->

                <div class="col-md-6">

                    <button
                        id="btnBuscar"
                        type="button"
                        class="btn btn-primary w-100 boton-menu">

                        🔎
                        <br>

                        Buscar producto

                    </button>

                </div>


                <!-- ESCANEAR QR -->

                <div class="col-md-6">

                    <button
                        id="btnEscanear"
                        type="button"
                        class="btn btn-success w-100 boton-menu">

                        📷
                        <br>

                        Escanear QR

                    </button>

                </div>


                <!-- NUEVA MATERIA PRIMA -->

                <div class="col-md-6">

                    <button
                        id="btnNuevaMateria"
                        type="button"
                        class="btn btn-warning w-100 boton-menu">

                        ➕
                        <br>

                        Nueva materia prima

                    </button>

                </div>


                <!-- ETIQUETAS QR -->

                <div class="col-md-6">

                    <button
                        id="btnEtiquetas"
                        type="button"
                        class="btn btn-dark w-100 boton-menu">

                        🏷️
                        <br>

                        Imprimir etiquetas QR

                    </button>

                </div>


            </div>


            <!-- =====================================
                 INFORMACIÓN
            ====================================== -->

            <div class="text-center mt-4">

                <small class="text-secondary">

                    Sistema de control de materias primas
                    ENDOCOL

                </small>

            </div>


        </div>


    </div>

</div>


<!-- ==========================================
     JAVASCRIPT
=========================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================
           BUSCAR PRODUCTO
        ===================================== */

        const btnBuscar =
            document.getElementById(
                "btnBuscar"
            );


        if (btnBuscar) {

            btnBuscar.onclick =
                function () {

                    window.location.href =
                        "producto.html";

                };

        }


        /* =====================================
           NUEVA MATERIA PRIMA
        ===================================== */

        const btnNuevaMateria =
            document.getElementById(
                "btnNuevaMateria"
            );


        if (btnNuevaMateria) {

            btnNuevaMateria.onclick =
                function () {

                    window.location.href =
                        "nueva-materia.html";

                };

        }


        /* =====================================
           ETIQUETAS QR
        ===================================== */

        const btnEtiquetas =
            document.getElementById(
                "btnEtiquetas"
            );


        if (btnEtiquetas) {

            btnEtiquetas.onclick =
                function () {

                    window.location.href =
                        "etiquetas.html";

                };

        }


        /* =====================================
           ESCANEAR QR
        ===================================== */

        const btnEscanear =
            document.getElementById(
                "btnEscanear"
            );


        if (btnEscanear) {

            btnEscanear.onclick =
                function () {

                    /*
                     * Si ya tienes implementado
                     * el lector QR en app.js,
                     * esta función intentará
                     * utilizarlo.
                     */

                    if (
                        typeof iniciarEscanerQR ===
                        "function"
                    ) {

                        iniciarEscanerQR();

                    }

                    else {

                        alert(
                            "La función de escaneo QR se encuentra disponible desde el módulo correspondiente."
                        );

                    }

                };

        }

    }
);

</script>


<!-- ==========================================
     APP.JS EXISTENTE
=========================================== -->

<script src="js/app.js"></script>


</body>

</html>
