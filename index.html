<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <title>Inventario Endocol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card sombra mt-5">
                <div class="card-body text-center">
                    <img src="img/logo.png" class="logo" alt="Logo Endocol">
                    <h2 class="mt-3">ENDOCOL</h2>
                    <p class="text-secondary">Sistema de Inventario</p>

                    <div class="alert alert-info text-start mt-4">
                        <strong>Escaneo QR:</strong><br>
                        Utilice la cámara normal del celular para escanear la etiqueta QR.
                        El QR abrirá directamente el producto correspondiente.
                    </div>

                    <div class="my-3"><strong>o</strong></div>

                    <label for="txtCodigo" class="form-label text-start w-100">Código del material</label>
                    <input type="text" id="txtCodigo" class="form-control form-control-lg" placeholder="Ej.: MP001" autocomplete="off">

                    <button type="button" class="btn btn-success btn-lg w-100 mt-3" id="btnBuscar">
                        Buscar producto
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
