<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Etiquetas QR - ENDOCOL</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

    <style>

        body {
            background: #f4f6f9;
        }

        .contenedor {
            max-width: 1200px;
            margin: auto;
        }

        .cabecera {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .etiquetas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10mm;
        }

        .etiqueta {
            background: white;
            border: 1px solid #999;
            border-radius: 5px;

            width: 100%;
            min-height: 80mm;

            padding: 8px;

            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;

            break-inside: avoid;
            page-break-inside: avoid;
        }

        .logo-texto {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .qr {
            width: 50mm;
            height: 50mm;
            object-fit: contain;
        }

        .codigo {
            font-size: 16px;
            font-weight: bold;
        }

        .descripcion {
            font-size: 12px;
            font-weight: 500;

            width: 100%;

            word-wrap: break-word;
        }

        .ubicacion {
            font-size: 11px;
            color: #555;
        }

        .controles {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .contador {
            font-weight: bold;
            color: #555;
        }

        .seleccion {
            position: absolute;
            top: 6px;
            left: 6px;
        }

        .etiqueta-wrapper {
            position: relative;
        }

        .cargando {
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }

        .error {
            color: #dc3545;
            text-align: center;
            padding: 30px;
        }

        @media print {

            @page {
                size: letter;
                margin: 10mm;
            }

            body {
                background: white;
            }

            .no-imprimir {
                display: none !important;
            }

            .contenedor {
                max-width: none;
                width: 100%;
            }

            .etiquetas {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 5mm;
            }

            .etiqueta {
                min-height: 75mm;
                border: 1px solid #000;
                border-radius: 0;
            }

        }

        @media (max-width: 900px) {

            .etiquetas {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .etiquetas {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="container-fluid py-4">

    <div class="contenedor">


        <!-- =====================================
             CABECERA
        ====================================== -->

        <div class="cabecera no-imprimir">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                <div>

                    <h2 class="mb-1">
                        🏷️ Etiquetas QR
                    </h2>

                    <div class="text-secondary">
                        Sistema de Inventario ENDOCOL
                    </div>

                </div>


                <div class="controles">

                    <button
                        class="btn btn-secondary"
                        id="btnVolver">

                        ← Volver

                    </button>


                    <button
                        class="btn btn-primary"
                        id="btnActualizar">

                        🔄 Actualizar

                    </button>


                    <button
                        class="btn btn-success"
                        id="btnImprimir">

                        🖨️ Imprimir seleccionadas

                    </button>


                    <button
                        class="btn btn-dark"
                        id="btnTodas">

                        ☑ Seleccionar todas

                    </button>

                </div>

            </div>


            <hr>


            <!-- BUSCADOR -->

            <div class="row g-2 align-items-center">

                <div class="col-md-8">

                    <input
                        type="text"
                        id="txtBuscar"
                        class="form-control"
                        placeholder="Buscar por código o descripción...">

                </div>


                <div class="col-md-4">

                    <div class="contador">
                        Materias primas:
                        <span id="contador">
                            0
                        </span>
                    </div>

                </div>

            </div>


            <div
                id="mensaje"
                class="mt-3">
            </div>

        </div>


        <!-- =====================================
             ETIQUETAS
        ====================================== -->

        <div
            id="contenedorEtiquetas"
            class="etiquetas">

            <div class="cargando">

                Consultando inventario...

            </div>

        </div>


    </div>

</div>


<!-- ==========================================
     JAVASCRIPT
=========================================== -->

<script src="js/etiquetas.js"></script>


</body>

</html>
