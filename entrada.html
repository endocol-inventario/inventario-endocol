<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar Entrada</title>

  <!-- Versión estable de Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container mt-4">
    <div class="card sombra">
      <div class="card-body">

        <h3 class="text-center mb-4">Registrar Entrada</h3>

        <label for="txtCodigo">Código</label>
        <input id="txtCodigo" class="form-control" readonly>

        <label for="txtCantidad" class="mt-3">Cantidad</label>
        <input id="txtCantidad" type="number" class="form-control" min="1" placeholder="Ej: 10">

        <label for="txtProveedor" class="mt-3">Proveedor</label>
        <input id="txtProveedor" class="form-control" placeholder="Nombre de proveedor">

        <label for="txtResponsable" class="mt-3">Responsable</label>
        <input id="txtResponsable" class="form-control" placeholder="Nombre de quien recibe">

        <label for="txtObs" class="mt-3">Observaciones</label>
        <textarea id="txtObs" class="form-control" rows="3" placeholder="Detalles o notas adicionales"></textarea>

        <!-- Se añade id="btnGuardar" y type="button" explícito -->
        <button id="btnGuardar" type="button" class="btn btn-success w-100 mt-4">
          Guardar Entrada
        </button>

      </div>
    </div>
  </div>

  <!-- Dejar únicamente el archivo JS encargado de procesar la entrada -->
  <script src="js/entrada.js"></script>

</body>

</html>
