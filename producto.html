<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Producto - Endocol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card sombra mt-4">
                <div class="card-body">
                    <h3 class="text-center mb-4">ENDOCOL</h3>

                    <div id="mensaje" class="alert d-none" role="alert"></div>

                    <div class="mb-3">
                        <label for="txtCodigo">Código</label>
                        <input class="form-control" id="txtCodigo" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="txtDescripcion">Descripción</label>
                        <input class="form-control" id="txtDescripcion" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="txtUnidad">Unidad</label>
                        <input class="form-control" id="txtUnidad" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="txtUbicacion">Ubicación</label>
                        <input class="form-control" id="txtUbicacion" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="txtStock">Stock Actual</label>
                        <input class="form-control fw-bold" id="txtStock" readonly>
                    </div>

                    <button id="btnEntrada" type="button" class="btn btn-success w-100 mt-3">Entrada</button>
                    <button id="btnSalida" type="button" class="btn btn-danger w-100 mt-3">Salida</button>
                    <button id="btnKardex" type="button" class="btn btn-primary w-100 mt-3">Ver Kardex</button>
                    <button id="btnVolver" type="button" class="btn btn-secondary w-100 mt-3">Volver</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/producto.js"></script>
</body>
</html>
