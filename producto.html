<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Producto - Endocol</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Estilos propios -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        /* ======================================
           CAMPOS DE INFORMACIÓN
        ====================================== */

        .campo-indicador {

            background-color: #f8f9fa;

            font-weight: 600;

        }


        /* ======================================
           STOCK ACTUAL
        ====================================== */

        .stock-actual {

            font-size: 1.20rem;

            font-weight: bold;

        }


        /* ======================================
           CONTENEDOR DEL ESTADO
        ====================================== */

        .estado-contenedor {

            border-radius: 10px;

            background-color: #f8f9fa;

            padding: 14px;

            text-align: center;

        }


        /* ======================================
           ESTADO
        ====================================== */

        #estadoProducto {

            font-size: 1rem;

            padding: 8px 18px;

        }

    </style>

</head>


<body>


<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">


            <div class="card sombra mt-4">


                <div class="card-body">


                    <!-- ==================================
                         TÍTULO
                    ================================== -->

                    <h3 class="text-center mb-4">

                        ENDOCOL

                    </h3>


                    <!-- ==================================
                         MENSAJE
                    ================================== -->

                    <div
                        id="mensaje"
                        class="alert d-none"
                        role="alert"
                    >
                    </div>


                    <!-- ==================================
                         CÓDIGO
                    ================================== -->

                    <div class="mb-3">

                        <label
                            for="txtCodigo"
                            class="form-label"
                        >

                            Código

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="txtCodigo"
                            readonly
                        >

                    </div>


                    <!-- ==================================
                         DESCRIPCIÓN
                    ================================== -->

                    <div class="mb-3">

                        <label
                            for="txtDescripcion"
                            class="form-label"
                        >

                            Descripción

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="txtDescripcion"
                            readonly
                        >

                    </div>


                    <!-- ==================================
                         UNIDAD
                    ================================== -->

                    <div class="mb-3">

                        <label
                            for="txtUnidad"
                            class="form-label"
                        >

                            Unidad

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="txtUnidad"
                            readonly
                        >

                    </div>


                    <!-- ==================================
                         UBICACIÓN
                    ================================== -->

                    <div class="mb-3">

                        <label
                            for="txtUbicacion"
                            class="form-label"
                        >

                            Ubicación

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="txtUbicacion"
                            readonly
                        >

                    </div>


                    <!-- ==================================
                         STOCK ACTUAL
                    ================================== -->

                    <div class="mb-3">

                        <label
                            for="txtStock"
                            class="form-label"
                        >

                            Stock actual

                        </label>


                        <input
                            type="text"
                            class="form-control stock-actual"
                            id="txtStock"
                            readonly
                        >

                    </div>


                    <!-- ==================================
                         MÍNIMO Y MÁXIMO
                    ================================== -->

                    <div class="row">


                        <!-- STOCK MÍNIMO -->

                        <div class="col-6 mb-3">

                            <label
                                for="txtStockMinimo"
                                class="form-label"
                            >

                                Stock mínimo

                            </label>


                            <input
                                type="text"
                                class="form-control campo-indicador"
                                id="txtStockMinimo"
                                readonly
                            >

                        </div>


                        <!-- STOCK MÁXIMO -->

                        <div class="col-6 mb-3">

                            <label
                                for="txtStockMaximo"
                                class="form-label"
                            >

                                Stock máximo

                            </label>


                            <input
                                type="text"
                                class="form-control campo-indicador"
                                id="txtStockMaximo"
                                readonly
                            >

                        </div>


                    </div>


                    <!-- ==================================
                         ESTADO DEL INVENTARIO
                    ================================== -->

                    <div class="estado-contenedor mb-3">


                        <div class="fw-bold mb-2">

                            Estado del inventario

                        </div>


                        <span
                            id="estadoProducto"
                            class="badge fs-6 px-3 py-2"
                        >

                            CONSULTANDO...

                        </span>


                    </div>


                    <!-- ==================================
                         BOTÓN ENTRADA
                    ================================== -->

                    <button
                        id="btnEntrada"
                        type="button"
                        class="btn btn-success w-100 mt-3"
                    >

                        Registrar entrada

                    </button>


                    <!-- ==================================
                         BOTÓN SALIDA
                    ================================== -->

                    <button
                        id="btnSalida"
                        type="button"
                        class="btn btn-danger w-100 mt-3"
                    >

                        Registrar salida

                    </button>


                    <!-- ==================================
                         BOTÓN KARDEX
                    ================================== -->

                    <button
                        id="btnKardex"
                        type="button"
                        class="btn btn-primary w-100 mt-3"
                    >

                        Ver Kardex

                    </button>


                    <!-- ==================================
                         BOTÓN VOLVER
                    ================================== -->

                    <button
                        id="btnVolver"
                        type="button"
                        class="btn btn-secondary w-100 mt-3"
                    >

                        Volver

                    </button>


                </div>

            </div>

        </div>

    </div>

</div>


<!-- ==========================================
     JAVASCRIPT DEL PRODUCTO
========================================== -->

<script src="js/producto.js"></script>


</body>

</html>
