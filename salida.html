<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar Salida</title>

  <!-- Bootstrap 5 Estabilizado -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container mt-4">
    <div class="card sombra">
      <div class="card-body">

        <h3 class="text-center mb-4 text-danger">Registrar Salida</h3>

        <label for="txtCodigo">Código</label>
        <input id="txtCodigo" class="form-control" readonly>

        <label for="txtCantidad" class="mt-3">Cantidad a retirar</label>
        <input id="txtCantidad" type="number" class="form-control" min="1" placeholder="Ej: 5">

        <label for="txtResponsable" class="mt-3">Responsable (Entrega / Retira)</label>
        <input id="txtResponsable" class="form-control" placeholder="Nombre de quien retira">

        <label for="txtDestino" class="mt-3">Destino / Área</label>
<input id="txtDestino" class="form-control" placeholder="Área o ubicación de destino">

        <label for="txtObs" class="mt-3">Observaciones / Motivo</label>
        <textarea id="txtObs" class="form-control" rows="3" placeholder="Razón del despacho o consumo"></textarea>

        <button id="btnGuardarSalida" type="button" class="btn btn-danger w-100 mt-4">
          Guardar Salida
        </button>

      </div>
    </div>
  </div>

  <!-- Script específico para procesar la salida -->
  <script src="js/salida.js"></script>

</body>

</html>
